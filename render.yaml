services:
  - type: web
    name: katmo-trends-collector
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: KATMO_API_KEY
        sync: false
      - key: TRENDS_REQUEST_GAP_SECONDS
        value: "3.5"
      - key: TRENDS_RETRY_BASE_SECONDS
        value: "8"
      - key: TRENDS_MAX_RETRIES
        value: "3"
      - key: TRENDS_CACHE_TTL_SECONDS
        value: "21600"
